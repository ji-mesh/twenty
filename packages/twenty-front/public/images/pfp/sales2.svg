<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="sales2 avatar, account executive with target badge, circular crop">
  <defs>
    <clipPath id="sl2Clip"><circle cx="200" cy="200" r="200"/></clipPath>
    <radialGradient id="sl2Glow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sl2Dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#c084fc" opacity="0.35"/>
    </pattern>
  </defs>
  <g clip-path="url(#sl2Clip)">
    <rect width="400" height="400" fill="#0a0d17"/>
    <circle cx="200" cy="150" r="195" fill="url(#sl2Glow)"/>
    <g opacity="0.4">
      <circle cx="330" cy="112" r="72" fill="url(#sl2Dots)"/>
      <circle cx="74" cy="304" r="52" fill="url(#sl2Dots)"/>
    </g>
    <g id="sl2-person" transform="translate(200,208)">
      <!-- contact shadow -->
      <ellipse cx="0" cy="168" rx="96" ry="13" fill="#000000" opacity="0.35"/>
      <!-- afro (behind head) -->
      <circle cx="0" cy="-50" r="50" fill="#2b2140" stroke="#000000" stroke-width="6"/>
      <circle cx="-48" cy="-34" r="18" fill="#2b2140" stroke="#000000" stroke-width="6"/>
      <circle cx="48" cy="-34" r="18" fill="#2b2140" stroke="#000000" stroke-width="6"/>
      <!-- torso shirt -->
      <path d="M -76,168 C -68,108 -44,76 -24,66 L 24,66 C 44,76 68,108 76,168 Z" fill="#1a1026" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <!-- open collar + undershirt -->
      <path d="M -20,66 L 0,90 L 20,66 Z" fill="#101827" stroke="#000000" stroke-width="5"/>
      <path d="M -24,66 L -4,76 L -18,90 Z" fill="#241a38" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 24,66 L 4,76 L 18,90 Z" fill="#241a38" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <!-- target badge -->
      <g transform="translate(0,122)">
        <circle r="17" fill="#0e0a1c" stroke="#000000" stroke-width="5"/>
        <circle r="11" fill="none" stroke="#c084fc" stroke-width="4"/>
        <circle r="4.5" fill="#22d3ee" stroke="#000000" stroke-width="3"/>
        <path d="M 5,-6 L 24,-24" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
        <polygon points="28,-30 17,-27 23,-19" fill="#e2e8f0" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 18,-20 L 24,-14 M 12,-26 L 18,-20" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <!-- neck -->
      <rect x="-15" y="24" width="30" height="48" rx="9" fill="#9c6644" stroke="#000000" stroke-width="6"/>
      <!-- head -->
      <g transform="translate(0,30)">
      <rect x="-46" y="-98" width="92" height="104" rx="32" fill="#9c6644" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="-46" cy="-40" r="10" fill="#9c6644" stroke="#000000" stroke-width="6"/>
      <circle cx="46" cy="-40" r="10" fill="#9c6644" stroke="#000000" stroke-width="6"/>
      <!-- brows -->
      <path d="M -26,-64 Q -18,-69 -10,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10,-64 Q 18,-69 26,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <ellipse cx="17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <circle cx="-16.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="17.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="-18.5" cy="-52" r="1.5" fill="#ffffff"/>
      <circle cx="15.5" cy="-52" r="1.5" fill="#ffffff"/>
      <!-- blush -->
      <ellipse cx="-31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.55"/>
      <ellipse cx="31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.55"/>
      <!-- smile -->
      <path d="M -8,-26 Q 0,-17 8,-26" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- afro front edge -->
      <path d="M -46,-60 C -48,-112 48,-112 46,-60 C 30,-80 -30,-80 -46,-60 Z" fill="#2b2140" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </g>
    <g id="sl2-sparkles">
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(88,118) scale(0.8)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#c084fc" opacity="0.9" transform="translate(336,90) scale(1.0)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.7" transform="translate(342,298) scale(0.65)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(78,302) scale(0.55)"/>
    </g>
  </g>
</svg>
