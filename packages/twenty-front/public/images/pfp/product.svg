<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="product avatar, product manager with rocket badge, circular crop">
  <defs>
    <clipPath id="prdClip"><circle cx="200" cy="200" r="200"/></clipPath>
    <radialGradient id="prdGlow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="prdDots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#22d3ee" opacity="0.35"/>
    </pattern>
  </defs>
  <g clip-path="url(#prdClip)">
    <rect width="400" height="400" fill="#0a0d17"/>
    <circle cx="200" cy="150" r="195" fill="url(#prdGlow)"/>
    <g opacity="0.4">
      <circle cx="330" cy="112" r="72" fill="url(#prdDots)"/>
      <circle cx="74" cy="304" r="52" fill="url(#prdDots)"/>
    </g>
    <g id="prd-person" transform="translate(200,208)">
      <!-- contact shadow -->
      <ellipse cx="0" cy="168" rx="96" ry="13" fill="#000000" opacity="0.35"/>
      <!-- bob back panel -->
      <rect x="-52" y="-54" width="104" height="64" rx="24" fill="#4a3580" stroke="#000000" stroke-width="7"/>
      <!-- torso blazer -->
      <path d="M -76,168 C -68,108 -44,76 -24,66 L 24,66 C 44,76 68,108 76,168 Z" fill="#241b3a" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <!-- shirt V + lapels -->
      <path d="M -20,66 L 0,92 L 20,66 Z" fill="#e2e8f0" stroke="#000000" stroke-width="5"/>
      <path d="M -24,66 L -6,74 L -18,88 Z" fill="#171226" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 24,66 L 6,74 L 18,88 Z" fill="#171226" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <!-- rocket badge -->
      <g transform="translate(0,120)">
        <path d="M 0,-24 C 10,-14 10,6 0,20 C -10,6 -10,-14 0,-24 Z" fill="#e2e8f0" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="0" cy="-6" r="5" fill="#22d3ee" stroke="#000000" stroke-width="3"/>
        <polygon points="-8,10 -16,22 -6,18" fill="#c084fc" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="8,10 16,22 6,18" fill="#c084fc" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="-4,20 4,20 0,32" fill="#00d2ff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <!-- neck -->
      <rect x="-15" y="24" width="30" height="48" rx="9" fill="#efb98a" stroke="#000000" stroke-width="6"/>
      <!-- head -->
      <g transform="translate(0,30)">
      <rect x="-46" y="-98" width="92" height="104" rx="32" fill="#efb98a" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="-46" cy="-40" r="10" fill="#efb98a" stroke="#000000" stroke-width="6"/>
      <circle cx="46" cy="-40" r="10" fill="#efb98a" stroke="#000000" stroke-width="6"/>
      <!-- brows -->
      <path d="M -26,-64 Q -18,-69 -10,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10,-64 Q 18,-69 26,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <ellipse cx="17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <circle cx="-16.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="17.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="-18.5" cy="-52" r="1.5" fill="#ffffff"/>
      <circle cx="15.5" cy="-52" r="1.5" fill="#ffffff"/>
      <!-- blush -->
      <ellipse cx="-31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
      <ellipse cx="31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.85"/>
      <!-- smile -->
      <path d="M -8,-26 Q 0,-17 8,-26" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- side-part bob fringe -->
      <path d="M -46,-56 C -48,-116 48,-116 46,-56 C 36,-80 6,-88 -16,-82 C -34,-77 -44,-68 -46,-56 Z" fill="#4a3580" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <!-- hair clip -->
      <rect x="24" y="-72" width="14" height="6" rx="3" fill="#e879f9" stroke="#000000" stroke-width="3"/>
      </g>
    </g>
    <g id="prd-sparkles">
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(88,118) scale(0.8)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#e879f9" opacity="0.9" transform="translate(336,90) scale(1.0)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.7" transform="translate(342,298) scale(0.65)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(78,302) scale(0.55)"/>
    </g>
  </g>
</svg>
