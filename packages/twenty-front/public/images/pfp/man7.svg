<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="man7 avatar, turtleneck with headphones around neck, circular crop">
  <defs>
    <clipPath id="m7Clip"><circle cx="200" cy="200" r="200"/></clipPath>
    <radialGradient id="m7Glow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="m7Dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#22d3ee" opacity="0.35"/>
    </pattern>
  </defs>
  <g clip-path="url(#m7Clip)">
    <rect width="400" height="400" fill="#0a0d17"/>
    <circle cx="200" cy="150" r="195" fill="url(#m7Glow)"/>
    <g opacity="0.4">
      <circle cx="330" cy="112" r="72" fill="url(#m7Dots)"/>
      <circle cx="74" cy="304" r="52" fill="url(#m7Dots)"/>
    </g>
    <g id="m7-person" transform="translate(200,208)">
      <!-- contact shadow -->
      <ellipse cx="0" cy="168" rx="96" ry="13" fill="#000000" opacity="0.35"/>
      <!-- torso turtleneck -->
      <path d="M -76,168 C -68,108 -44,76 -24,66 L 24,66 C 44,76 68,108 76,168 Z" fill="#101827" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <rect x="-20" y="56" width="40" height="16" rx="8" fill="#1b2436" stroke="#000000" stroke-width="5"/>
      <!-- headphones around neck -->
      <path d="M -34,58 C -34,40 34,40 34,58" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      <path d="M -34,58 C -34,40 34,40 34,58" fill="none" stroke="#c084fc" stroke-width="7" stroke-linecap="round"/>
      <rect x="-44" y="50" width="18" height="26" rx="7" fill="#131722" stroke="#000000" stroke-width="5"/>
      <rect x="26" y="50" width="18" height="26" rx="7" fill="#131722" stroke="#000000" stroke-width="5"/>
      <circle cx="-35" cy="63" r="3.5" fill="#c084fc"/>
      <circle cx="35" cy="63" r="3.5" fill="#c084fc"/>
      <!-- neck -->
      <rect x="-15" y="24" width="30" height="48" rx="9" fill="#8d5a3b" stroke="#000000" stroke-width="6"/>
      <!-- head -->
      <g transform="translate(0,30)">
      <rect x="-46" y="-98" width="92" height="104" rx="32" fill="#8d5a3b" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="-46" cy="-40" r="10" fill="#8d5a3b" stroke="#000000" stroke-width="6"/>
      <circle cx="46" cy="-40" r="10" fill="#8d5a3b" stroke="#000000" stroke-width="6"/>
      <!-- hoop earring -->
      <circle cx="46" cy="-26" r="6" fill="none" stroke="#22d3ee" stroke-width="3.5"/>
      <!-- brows -->
      <path d="M -26,-64 Q -18,-69 -10,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10,-64 Q 18,-69 26,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <ellipse cx="17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <circle cx="-16.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="17.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="-18.5" cy="-52" r="1.5" fill="#ffffff"/>
      <circle cx="15.5" cy="-52" r="1.5" fill="#ffffff"/>
      <!-- blush -->
      <ellipse cx="-31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.7"/>
      <ellipse cx="31" cy="-36" rx="6.5" ry="4" fill="#f9a8d4" opacity="0.7"/>
      <!-- smile -->
      <path d="M -8,-26 Q 0,-17 8,-26" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- buzz-cut hair -->
      <path d="M -46,-52 C -48,-108 48,-108 46,-52 C 40,-74 -40,-74 -46,-52 Z" fill="#2e2640" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      </g>
    </g>
    <g id="m7-sparkles">
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(88,118) scale(0.8)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#c084fc" opacity="0.9" transform="translate(336,90) scale(1.0)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.7" transform="translate(342,298) scale(0.65)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(78,302) scale(0.55)"/>
    </g>
  </g>
</svg>
