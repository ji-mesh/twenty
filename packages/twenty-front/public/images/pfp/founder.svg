<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="founder avatar, blazer with JiMesh cube badge, circular crop">
  <defs>
    <clipPath id="fndClip"><circle cx="200" cy="200" r="200"/></clipPath>
    <radialGradient id="fndGlow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fndDots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#c084fc" opacity="0.3"/>
    </pattern>
  </defs>
  <g clip-path="url(#fndClip)">
    <rect width="400" height="400" fill="#0a0d17"/>
    <circle cx="200" cy="150" r="195" fill="url(#fndGlow)"/>
    <g opacity="0.4">
      <circle cx="330" cy="112" r="72" fill="url(#fndDots)"/>
      <circle cx="74" cy="304" r="52" fill="url(#fndDots)"/>
    </g>
    <g id="fnd-person" transform="translate(200,208)">
      <!-- contact shadow -->
      <ellipse cx="0" cy="168" rx="96" ry="13" fill="#000000" opacity="0.35"/>
      <!-- torso blazer -->
      <path d="M -76,168 C -68,108 -44,76 -24,66 L 24,66 C 44,76 68,108 76,168 Z" fill="#131c2e" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <!-- shirt V + lapels + tie -->
      <path d="M -20,66 L 0,94 L 20,66 Z" fill="#e2e8f0" stroke="#000000" stroke-width="5"/>
      <path d="M -24,66 L -6,74 L -18,88 Z" fill="#0d1420" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 24,66 L 6,74 L 18,88 Z" fill="#0d1420" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="0,82 6,94 0,132 -6,94" fill="#1b2a4a" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
      <!-- cube badge -->
      <g transform="translate(0,124) scale(0.17)">
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="#000000" transform="scale(1.3) translate(0, 4)"/>
        <polygon points="0,-140 122,-70 0,0 -122,-70" fill="#22d3ee"/>
        <polygon points="-122,-70 0,0 0,140 -122,70" fill="#c084fc"/>
        <polygon points="0,0 122,-70 122,70 0,140" fill="#0284c7"/>
        <polygon points="0,-140 122,-70 122,70 0,140 -122,70 -122,-70" fill="none" stroke="#000000" stroke-width="15" stroke-linejoin="round"/>
      </g>
      <!-- neck -->
      <rect x="-15" y="24" width="30" height="48" rx="9" fill="#b97a56" stroke="#000000" stroke-width="6"/>
      <!-- head -->
      <g transform="translate(0,30)">
      <rect x="-46" y="-98" width="92" height="104" rx="32" fill="#b97a56" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="-46" cy="-40" r="10" fill="#b97a56" stroke="#000000" stroke-width="6"/>
      <circle cx="46" cy="-40" r="10" fill="#b97a56" stroke="#000000" stroke-width="6"/>
      <!-- brows -->
      <path d="M -26,-64 Q -18,-69 -10,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 10,-64 Q 18,-69 26,-64" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="-17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <ellipse cx="17" cy="-50" rx="5.5" ry="6.5" fill="#ffffff"/>
      <circle cx="-16.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="17.5" cy="-49" r="3.2" fill="#000000"/>
      <circle cx="-18.5" cy="-52" r="1.5" fill="#ffffff"/>
      <circle cx="15.5" cy="-52" r="1.5" fill="#ffffff"/>
      <!-- smile -->
      <path d="M -8,-26 Q 0,-17 8,-26" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <!-- swept-back hair -->
      <path d="M -46,-56 C -50,-116 50,-120 46,-56 C 36,-80 4,-88 -18,-82 C -36,-77 -44,-68 -46,-56 Z" fill="#443c6e" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      </g>
    </g>
    <g id="fnd-sparkles">
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.9" transform="translate(88,118) scale(0.8)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#22d3ee" opacity="0.9" transform="translate(336,90) scale(1.0)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#c084fc" opacity="0.7" transform="translate(342,298) scale(0.65)"/>
      <path d="M 0,-12 C 2.2,-4 4,-2.2 12,0 C 4,2.2 2.2,4 0,12 C -2.2,4 -4,2.2 -12,0 C -4,-2.2 -2.2,-4 0,-12 Z" fill="#ffffff" opacity="0.55" transform="translate(78,302) scale(0.55)"/>
    </g>
  </g>
</svg>
